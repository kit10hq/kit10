<html>
	<head>
		<title>Profile</title>
	</head>
	<body>
		Profile page for user#<span id="profile_id"></span>
		<script>
		const REGEX = /\/profile\/(?<id>.+)/;
		const { id } = REGEX.exec(window.location.pathname).groups;
		document.getElementById('profile_id').textContent = id;
		</script>
	</body>
</html>
