gzip_static on;
gzip_vary on;

map_hash_max_size 1024;
map_hash_bucket_size 1024;

map $uri $kit10_route_file {
	default /__kit10_not_found__;

	# MARK: routes

	/+service-worker.js /+workers/+service/+worker.worker.js;
}

map $uri $kit10_link_header {
	default "";

	# MARK: link headers
}

map $uri $kit10_index_file {
	default "$uri/index+page.html";
	~/$     "${uri}index+page.html";
}
